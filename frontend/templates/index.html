<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>LLM Process Analyzer</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
    <h2 class="mb-4">Análisis de Procesos Empresariales</h2>

    <div class="card p-4">
        <div class="mb-3">
            <label class="form-label">Subir archivo Excel</label>
            <input type="file" id="excelFile" class="form-control" accept=".xlsx,.xls">
        </div>

        <button class="btn btn-success" onclick="analyzeExcel()">
            Analizar Excel
        </button>

        <div id="excelLoading" class="mt-3 text-success d-none">
            Analizando archivo Excel. Por favor, espere...
        </div>
    </div>

    <div id="excelResult" class="mt-4"></div>
</div>

<script src="/static/js/main.js"></script>
</body>
</html>
