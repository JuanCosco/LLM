<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>LLM Process Analyzer</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
    <h2 class="mb-4">Análisis de Procesos Empresariales</h2>

    <div class="card p-4">
        <div class="mb-3">
            <label class="form-label">Descripción del proceso</label>
            <textarea id="textInput" class="form-control" rows="4"></textarea>
        </div>

        <button class="btn btn-primary" onclick="analyzeText()">Analizar</button>
    </div>

    <pre class="mt-4 bg-white p-3" id="result"></pre>
</div>

<script src="/static/js/main.js"></script>
</body>
</html>
